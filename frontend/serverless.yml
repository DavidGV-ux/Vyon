service: vyon-api
frameworkVersion: '^3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 30
  stackName: vyon-api-${self:provider.stage}
  deploymentBucket:
    name: vyon-api-deploys-${self:provider.region}-${self:provider.stage}
    serverSideEncryption: AES256
  environment:
    NODE_ENV: production
    LOG_LEVEL: info
    AI_PROVIDER: ${env:AI_PROVIDER, deterministic}
    AI_TIMEOUT_MS: ${env:AI_TIMEOUT_MS, 3800}
    AI_MAX_TOKENS: ${env:AI_MAX_TOKENS, 2048}
    AI_TEMPERATURE: ${env:AI_TEMPERATURE, 0.2}
    ANTHROPIC_API_KEY: ${env:ANTHROPIC_API_KEY, ''}
    ANTHROPIC_MODEL: ${env:ANTHROPIC_MODEL, claude-3-5-sonnet-latest}
    OPENAI_API_KEY: ${env:OPENAI_API_KEY, ''}
    OPENAI_BASE_URL: ${env:OPENAI_BASE_URL, https://api.openai.com/v1}
    OPENAI_MODEL: ${env:OPENAI_MODEL, gpt-4o-mini}
    WHISPER_API_BASE: ${env:WHISPER_API_BASE, https://api.openai.com/v1}
    WHISPER_API_KEY: ${env:WHISPER_API_KEY, ''}
    WHISPER_MODEL: ${env:WHISPER_MODEL, whisper-1}
    WHISPER_LANGUAGE: ${env:WHISPER_LANGUAGE, es}
    SUPABASE_URL: ${env:SUPABASE_URL, ''}
    SUPABASE_ANON_KEY: ${env:SUPABASE_ANON_KEY, ''}
    AUTH_REQUIRED: ${env:AUTH_REQUIRED, false}
    REQUEST_BUDGET_MS: ${env:REQUEST_BUDGET_MS, 3800}
    CORS_ORIGIN: ${env:CORS_ORIGIN, *}
    METRICS_ENABLED: 'true'
    PORT: '3000'
    # --- MECL-056: WhatsApp retention + reactivation (Twilio) ---
    WHATSAPP_PROVIDER: ${env:WHATSAPP_PROVIDER, twilio}
    WHATSAPP_DEFAULT_LANGUAGE: ${env:WHATSAPP_DEFAULT_LANGUAGE, es}
    WHATSAPP_RETENTION_ENABLED: ${env:WHATSAPP_RETENTION_ENABLED, 'true'}
    WHATSAPP_RETENTION_THRESHOLD_DAYS: ${env:WHATSAPP_RETENTION_THRESHOLD_DAYS, 30}
    WHATSAPP_REACTIVATION_ENABLED: ${env:WHATSAPP_REACTIVATION_ENABLED, 'true'}
    WHATSAPP_REACTIVATION_DELAYS: ${env:WHATSAPP_REACTIVATION_DELAYS, '0,3,7'}
    TWILIO_ACCOUNT_SID: ${env:TWILIO_ACCOUNT_SID, ''}
    TWILIO_AUTH_TOKEN: ${env:TWILIO_AUTH_TOKEN, ''}
    TWILIO_WHATSAPP_FROM: ${env:TWILIO_WHATSAPP_FROM, ''}
    TWILIO_MESSAGING_SERVICE_SID: ${env:TWILIO_MESSAGING_SERVICE_SID, ''}
    TWILIO_API_BASE: ${env:TWILIO_API_BASE, https://api.twilio.com}
    TWILIO_TIMEOUT_MS: ${env:TWILIO_TIMEOUT_MS, 8000}
    # --- MECL-058: optimización de tokens ---
    AI_CACHE_TTL_MS: ${env:AI_CACHE_TTL_MS, 1800000}
    AI_CACHE_MAX_ENTRIES: ${env:AI_CACHE_MAX_ENTRIES, 200}
    AI_MAX_TOKENS_RESUMENES: ${env:AI_MAX_TOKENS_RESUMENES, 1200}
    AI_MAX_TOKENS_TAREAS: ${env:AI_MAX_TOKENS_TAREAS, 1600}
    AI_MAX_TOKENS_FINANZAS: ${env:AI_MAX_TOKENS_FINANZAS, 1600}
  logRetentionInDays: 30

package:
  patterns:
    - '!**/*'
    - 'server/dist/**'
    - 'server/prompts/**'
    - 'node_modules/**'
    - '!node_modules/.cache/**'

functions:
  api:
    name: vyon-api-${self:provider.stage}
    handler: server/dist/composition/lambda.handler
    description: 'VYON hexagonal API (analysis, transcription, health)'
    url:
      cors: true
      authorizer: none
    events: []
    alarms:
      - name: Errors
        metric: Errors
        threshold: 5
        period: 60
        evaluationPeriods: 2
        comparisonOperator: GreaterThanThreshold
        treatMissingData: notBreaching
      - name: DurationP95
        metric: Duration
        statistic: p95
        threshold: 4000
        period: 60
        evaluationPeriods: 3
        comparisonOperator: GreaterThanThreshold
        treatMissingData: notBreaching
      - name: Throttles
        metric: Throttles
        threshold: 1
        period: 60
        evaluationPeriods: 1
        comparisonOperator: GreaterThanThreshold
        treatMissingData: notBreaching

  engagement:
    name: vyon-engagement-${self:provider.stage}
    handler: server/dist/composition/lambda-scheduled.handler
    description: 'MECL-056: dispatch WhatsApp retention + reactivation messages'
    memorySize: 512
    timeout: 60
    events:
      - schedule:
          name: vyon-engagement-daily-${self:provider.stage}
          rate: rate(1 day)
          enabled: ${env:ENGAGEMENT_SCHEDULE_ENABLED, 'true'}

resources:
  Resources:
    ApiLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/lambda/vyon-api-${self:provider.stage}
        RetentionInDays: 30
    AlertTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: vyon-api-alerts-${self:provider.stage}
    AlertSubscription:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: { Ref: AlertTopic }
        Protocol: email
        Endpoint: ${env:ALERT_EMAIL, ops@example.com}

  Outputs:
    ApiFunctionUrl:
      Description: 'Public Function URL of the VYON API'
      Value:
        Fn::GetAtt: [ApiLambdaFunctionUrl, FunctionUrl]
